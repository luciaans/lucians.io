<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1e1b" />
      <stop offset="100%" stop-color="#141312" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c87852" />
      <stop offset="100%" stop-color="#e09060" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c87852" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#141312" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" rx="16" />
  <circle cx="200" cy="180" r="140" fill="url(#glow)" />

  <!-- Code/Matrix ambient grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
  </g>

  <!-- Abstract developer portrait / silhouette -->
  <g transform="translate(200, 195)">
    <!-- Shoulders / Torso -->
    <path d="M-90,135 C-90,80 -50,60 0,60 C50,60 90,80 90,135 Z" fill="#262522" stroke="#383632" stroke-width="2" />
    <!-- Collar / Hoodie V -->
    <path d="M-35,65 L0,105 L35,65" fill="none" stroke="#48453f" stroke-width="2" stroke-linecap="round" />
    
    <!-- Neck -->
    <rect x="-18" y="25" width="36" height="40" rx="6" fill="#302e2a" />
    
    <!-- Head -->
    <ellipse cx="0" cy="5" rx="42" ry="48" fill="#2d2a26" stroke="#3d3a35" stroke-width="2" />
    
    <!-- Hair / Beanie silhouette -->
    <path d="M-44,-10 C-44,-45 -25,-55 0,-55 C25,-55 44,-45 44,-10 C38,-15 15,-18 0,-18 C-15,-18 -38,-15 -44,-10 Z" fill="#1b1a18" />

    <!-- Glasses / Modern Dev Eyewear -->
    <rect x="-34" y="-3" width="28" height="18" rx="4" fill="none" stroke="url(#accent)" stroke-width="2.5" />
    <rect x="6" y="-3" width="28" height="18" rx="4" fill="none" stroke="url(#accent)" stroke-width="2.5" />
    <line x1="-6" y1="5" x2="6" y2="5" stroke="url(#accent)" stroke-width="2.5" />

    <!-- Terminal Prompt Accent Badge -->
    <g transform="translate(0, 100)">
      <rect x="-48" y="-12" width="96" height="24" rx="12" fill="#171614" stroke="#c87852" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="0" y="4" font-family="monospace" font-size="11" fill="#e8e5dc" font-weight="600" text-anchor="middle" letter-spacing="1">LUCIANS</text>
    </g>
  </g>
</svg>